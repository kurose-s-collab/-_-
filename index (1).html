  <title>社会科「学びの可視化」アプリ</title>
  <style>
    :root {
      --indigo-50:#eef2ff; --indigo-100:#e0e7ff; --indigo-200:#c7d2fe; --indigo-500:#6366f1; --indigo-600:#4f46e5; --indigo-700:#4338ca; --indigo-800:#3730a3; --indigo-950:#1e1b4b;
      --emerald-50:#ecfdf5; --emerald-200:#a7f3d0; --emerald-600:#059669; --emerald-700:#047857;
      --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-200:#fde68a; --amber-500:#f59e0b; --amber-700:#b45309; --amber-800:#92400e;

      --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1; --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --slate-900:#0f172a;

    .header{position:sticky;top:0;z-index:40;background:var(--indigo-700);color:#fff;box-shadow:0 4px 12px rgba(15,23,42,.15)}
    .header-main{max-width:1120px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}.brand-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:22px}.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.01em}.brand p{font-size:11px;margin:2px 0 0;color:#c7d2fe}
    .header-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}.btn:hover{filter:brightness(1.05)}.btn-indigo{background:#4f46e5;color:#fff}.btn-green{background:#059669;color:#fff}.btn-dark{background:#334155;color:#fff}.btn-amber{background:#f59e0b;color:#fff}.btn-light{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}.btn-danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
    .filebar{background:rgba(30,27,75,.35);border-top:1px solid rgba(255,255,255,.12)}.filebar-inner{max-width:1120px;margin:auto;padding:7px 16px;display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:#e0e7ff}.good{color:#a7f3d0;font-weight:800}.warn{color:#fde68a;font-weight:800}
    .container{max-width:1120px;margin:0 auto;padding:18px 16px}.stack{display:flex;flex-direction:column;gap:14px}

    .unit-summary{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}.eyebrow{font-size:11px;font-weight:800;color:var(--indigo-600);margin-bottom:5px}.select{width:100%;max-width:640px;border:1px solid var(--slate-300);border-radius:9px;padding:9px 10px;background:#fff;font-size:13px;font-weight:700}.score-big{text-align:right}.score-big .num{font-size:40px;font-weight:900;color:var(--indigo-700);line-height:1}.score-big .label{font-size:11px;color:var(--slate-500);margin-top:5px}.score-big .diff{font-size:12px;font-weight:800;margin-top:5px}.positive{color:var(--emerald-600)}.negative{color:var(--rose-600)}
    .lesson-badge{display:inline-flex;align-items:center;background:var(--amber-100);border:1px solid var(--amber-200);color:var(--amber-800);font-size:11px;font-weight:900;border-radius:999px;padding:4px 9px;margin-top:8px}
    .tabs{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:6px;display:flex;gap:5px}.tab{flex:1;border:0;border-radius:8px;background:transparent;color:var(--slate-600);font-size:12px;font-weight:800;padding:9px}.tab.active{background:var(--indigo-600);color:#fff;box-shadow:0 2px 6px rgba(79,70,229,.2)}
    .grid-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:block;font-size:11px;font-weight:800;color:var(--slate-600)}.field input,.field textarea,.input{width:100%;margin-top:5px;border:1px solid var(--slate-300);border-radius:9px;padding:9px 10px;background:#fff;color:var(--slate-800);font-size:13px;font-weight:400;outline:none}.field input:focus,.field textarea:focus,.input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.1)}textarea{resize:vertical}
    .row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.muted{color:var(--slate-500)}.tiny{font-size:10px}.small{font-size:12px}.bold{font-weight:800}
    .vp-list{display:flex;flex-direction:column;gap:10px}.vp-card{border:1px solid var(--slate-200);border-radius:12px;padding:12px;background:rgba(248,250,252,.7);display:flex;gap:9px;align-items:flex-start}.vp-index{width:28px;height:28px;border-radius:50%;background:var(--indigo-100);color:var(--indigo-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 auto}.vp-body{flex:1;min-width:0}.vp-name{width:100%;border:0;border-bottom:1px dashed var(--slate-300);background:transparent;padding:0 0 5px;font-size:13px;font-weight:800;outline:none}.vp-score-row{display:grid;grid-template-columns:1fr 76px 18px;gap:10px;align-items:center;margin-top:8px}.number-input{width:76px;border:1px solid var(--slate-300);border-radius:8px;padding:6px;text-align:center;font-weight:900;color:var(--indigo-700)}.vp-note{width:100%;border:1px solid var(--slate-200);border-radius:8px;padding:8px 9px;font-size:11px;margin-top:8px;background:#fff}.icon-btn{border:0;background:transparent;color:var(--slate-400);padding:4px;font-size:16px}.icon-btn:hover{color:var(--rose-600)}
    .manual-box{background:var(--indigo-50);border:1px solid var(--indigo-100);border-radius:12px;padding:11px;display:grid;grid-template-columns:1fr 76px 18px;gap:10px;align-items:center}
    .reflection-score{background:var(--indigo-50);border:1px solid var(--indigo-100);border-radius:12px;padding:14px;text-align:center}.reflection-score .num{font-size:46px;line-height:1;font-weight:900;color:var(--indigo-700)}.required{color:var(--rose-600);font-weight:900}.reflection-text{width:100%;border:1px solid var(--slate-300);border-radius:11px;padding:11px;font-size:13px;min-height:130px}.reflection-text.invalid{border-color:var(--rose-200);background:var(--rose-50)}
    .preset{width:100%;text-align:left;border:1px solid var(--slate-200);border-radius:11px;padding:10px;background:#fff;margin-top:8px}.preset:hover{border-color:#a5b4fc;background:var(--indigo-50)}.preset-title{font-size:11px;font-weight:800}.preset-question{font-size:10px;color:var(--slate-500);margin-top:3px}
    .chart-wrap{position:relative;height:340px}.chart-wrap.small{height:280px}.chart-canvas{display:block;width:100%;height:100%}.chart-empty{background:var(--slate-50);border-radius:12px;padding:26px;text-align:center;color:var(--slate-500);font-size:13px}
    .current-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px}.vp-summary{display:flex;flex-direction:column;gap:8px}.vp-summary-item{border:1px solid var(--slate-200);border-radius:11px;padding:10px}.vp-summary-top{display:flex;justify-content:space-between;gap:10px}.vp-summary-score{font-weight:900;color:var(--indigo-700)}
    .pills{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--slate-200);background:#fff;color:var(--slate-600);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800}.pill.active{background:var(--indigo-600);border-color:var(--indigo-600);color:#fff}
    .history{display:flex;flex-direction:column;gap:9px}.history-item{border:1px solid var(--slate-200);border-radius:12px;padding:12px;display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start}.history-score{width:62px;height:62px;border-radius:12px;background:var(--indigo-50);color:var(--indigo-700);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}.history-meta{font-size:10px;color:var(--slate-500);display:flex;gap:8px;flex-wrap:wrap;align-items:center}.history-lesson{display:inline-flex;background:var(--amber-100);color:var(--amber-800);border:1px solid var(--amber-200);border-radius:999px;padding:2px 7px;font-weight:900}.history-comment{font-size:13px;margin-top:5px;white-space:pre-wrap}
    .modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:#fff;width:min(560px,100%);border-radius:16px;box-shadow:0 18px 60px rgba(15,23,42,.24);padding:20px}.modal h3{font-size:16px;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
    .footer{max-width:1120px;margin:16px auto 0;padding:0 16px}.privacy{border-top:1px solid var(--slate-200);padding-top:12px;color:var(--slate-500);font-size:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .hidden{display:none!important}
    @media(max-width:860px){.grid-main,.current-grid,.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}.score-big{text-align:left}.unit-summary{grid-template-columns:1fr}.header-main{align-items:flex-start}.header-actions{width:100%}.header-actions .btn{flex:1}.history-item{grid-template-columns:56px 1fr auto}.history-score{width:56px;height:56px}}
    @media(max-width:540px){.container{padding:12px 10px}.card{padding:14px}.brand p{display:none}.btn{padding:8px 9px}.vp-score-row,.manual-box{grid-template-columns:1fr 68px 18px}.security-controls{white-space:normal}}
    @media print{.no-print{display:none!important}}
  </style>

<body>
<input id="fallbackFileInput" type="file" accept="application/json,.json" hidden>
<div id="app"></div>

<script>
'use strict';

const STORAGE_KEY = 'social_studies_vis_data_v12_secure';
const LEGACY_KEYS = ['social_studies_vis_data_v11','social_studies_vis_data_v10','social_studies_vis_data_v9','social_studies_vis_data_v8','social_studies_vis_data_v7','social_studies_vis_data_v6'];
const AUTO_SAVE_PREF_KEY = 'social_studies_vis_auto_save_enabled_v1';
const FILE_HANDLE_DB = 'social_studies_vis_file_handle_db';
const FILE_HANDLE_STORE = 'handles';
const FILE_HANDLE_KEY = 'primary-data-file';
const COLORS = ['#4f46e5','#059669','#d97706','#db2777','#0891b2','#7c3aed','#ea580c','#0f766e','#be123c'];

const SOCIAL_PRESETS = [
  {id:'unit-geo-1',unit:'持続可能な地域社会の形成（地理）',question:'地域の人口変化や自然環境を踏まえ、持続可能なまちづくりを行うにはどのような視点が必要だろうか？',targetGoal:'多角的な視点（防災・産業・人口）から地域の課題を分析し、根拠をもった持続可能なまちづくりの提案ができるようになる。',viewpoints:['自然環境と防災','産業・雇用と交通網','人口動態・高齢化','地域の歴史的背景','他地域・持続可能対策']},
  {id:'unit-hist-1',unit:'近代日本の歩みと国際社会（歴史）',question:'明治維新以降の日本の近代化は、人々の生活や国際関係にどのような影響を与えただろうか？',targetGoal:'近代化の光と影の両面を捉え、歴史的資料に基づいて自分の考えをまとめ論理的に記述できるようになる。',viewpoints:['政治・憲法制度の変遷','産業革命と経済の発展','外交関係と条約改正','人々の暮らしと文化の変化','周辺国との関わり']},
  {id:'unit-civ-1',unit:'現代の民主政治と日本国憲法（公民）',question:'個人の尊厳を守り、多様な人々が共に生きる社会をつくるために、私たちはどのように政治に関わるべきか？',targetGoal:'対立と合意の観点を理解し、主権者として社会課題に対する多様な意見を尊重しながら参画する意欲を高める。',viewpoints:['基本的人権の尊重','国会・内閣・裁判所の働き','地方自治と住民参加','メディアと情報活用','現代社会の課題解決']}
];

function createInitialData(){
  return {
    studentInfo:{className:'',number:'',name:''},
    currentUnitId:'unit-geo-1',
    units:[{
      id:'unit-geo-1',
      unitTitle:'持続可能な地域社会の形成（地理）',
      centralQuestion:'地域の人口変化や自然環境を踏まえ、持続可能なまちづくりを行うにはどのような視点が必要だろうか？',
      targetGoal:'多角的な視点（防災・産業・人口）から地域の課題を捉え、根拠のある持続可能な解決策を表現できるようになる。',
      isManualOverall:false, manualOverallScore:60,
      viewpoints:[
        {id:'vp-1',name:'自然環境・災害への備え',score:65,note:''},
        {id:'vp-2',name:'産業・交通網の現状',score:80,note:''},
        {id:'vp-3',name:'人口変化と高齢化',score:45,note:''},
        {id:'vp-4',name:'地域の歴史的背景',score:70,note:''}
      ],
      snapshots:[]
    }]
  };
}

function clampScore(v){ return Math.max(0,Math.min(100,Math.round(Number(v)||0))); }
function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeFileName(text){ return String(text||'生徒').replace(/[\\/:*?"<>|]/g,'_').trim()||'生徒'; }
function dateForFile(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function studentLabel(){
  const s=data.studentInfo||{};
  if((s.name||'').trim()) return s.name.trim();
  const fallback=[s.className,s.number?`${s.number}番`:null].filter(Boolean).join('_');
  return fallback||'生徒';
}
function uuid(prefix){ return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`; }
function isEmbeddedView(){ try{return window.self!==window.top}catch{return true} }
function canUseNativeFilePicker(){ return !isEmbeddedView() && window.isSecureContext && typeof window.showOpenFilePicker==='function' && typeof window.showSaveFilePicker==='function'; }

function normalizeImportedData(parsed){
  if(!parsed || !Array.isArray(parsed.units) || !parsed.units.length) throw new Error('このファイルは学習データの形式ではありません。');
  const units=parsed.units.map((unit,ui)=>{
    const unitId=unit.id||`unit-import-${Date.now()}-${ui}`;
    const viewpoints=Array.isArray(unit.viewpoints)&&unit.viewpoints.length ? unit.viewpoints.map((vp,vi)=>({
      id:vp.id||`vp-import-${ui}-${vi}`, name:vp.name||`項目${vi+1}`, score:clampScore(vp.score), note:vp.note||''
    })) : [{id:`vp-import-${ui}-0`,name:'学習内容の理解',score:50,note:''}];
    return {
      id:unitId, unitTitle:unit.unitTitle||unit.title||`単元${ui+1}`, centralQuestion:unit.centralQuestion||unit.question||'', targetGoal:unit.targetGoal||'',
      isManualOverall:!!unit.isManualOverall, manualOverallScore:clampScore(unit.manualOverallScore), viewpoints,
      snapshots:Array.isArray(unit.snapshots)?unit.snapshots.map((s,si)=>({...s,lessonNumber:Number(s.lessonNumber)||(si+1),overall:clampScore(s.overall),comment:s.comment||'',lessonGoal:s.lessonGoal||s.goal||''})):[]
    };
  });
  const wanted=parsed.currentUnitId;
  return {
    ...parsed,
    studentInfo:{className:parsed.studentInfo?.className||'',number:parsed.studentInfo?.number||'',name:parsed.studentInfo?.name||''},
    currentUnitId:units.some(u=>u.id===wanted)?wanted:units[0].id,
    units
  };
}

function loadInitialData(){
  const keys=[STORAGE_KEY,...LEGACY_KEYS];
  for(const key of keys){
    try{ const raw=localStorage.getItem(key); if(raw) return normalizeImportedData(JSON.parse(raw)); }catch(e){ console.warn('保存データの読み込みに失敗',e); }
  }
  return createInitialData();
}

let data=loadInitialData();
let activeTab='input';
let todayComment='';
let todayGoal='';
let newViewpointName='';
let selectedViewpointId=null;
let fileHandle=null;
let fileName='';
let filePermissionState='none';
let statusMessage='';
let errorMessage='';
let statusTimer=null;
let autoSaveEnabled=localStorage.getItem(AUTO_SAVE_PREF_KEY)!=='false';
let modalOpen=false;
let newUnitDraft={unitTitle:'',centralQuestion:'',targetGoal:'',firstViewpoint:'学習内容の理解'};

function persistData(){
  if(!autoSaveEnabled) return;
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); }catch(e){ console.warn('端末内自動保存に失敗',e); }
}
function clearLegacyLocalData(){ [STORAGE_KEY,...LEGACY_KEYS].forEach(k=>localStorage.removeItem(k)); }
function currentUnit(){ return data.units.find(u=>u.id===data.currentUnitId)||data.units[0]; }
function updateCurrentUnit(mutator){
  const idx=data.units.findIndex(u=>u.id===data.currentUnitId);
  if(idx<0) return;
  const clone={...data.units[idx],viewpoints:data.units[idx].viewpoints.map(v=>({...v})),snapshots:[...(data.units[idx].snapshots||[])]};
  mutator(clone);
  data.units=[...data.units.slice(0,idx),clone,...data.units.slice(idx+1)];
  persistData();
}
function calculatedOverall(unit=currentUnit()){
  if(!unit?.viewpoints?.length) return 0;
  return Math.round(unit.viewpoints.reduce((s,v)=>s+clampScore(v.score),0)/unit.viewpoints.length);
}
function effectiveOverall(unit=currentUnit()){ return unit.isManualOverall?clampScore(unit.manualOverallScore):calculatedOverall(unit); }
function currentLessonNumber(unit=currentUnit()){
  const ss=unit.snapshots||[]; if(!ss.length) return 1;
  return ss.reduce((m,s,i)=>Math.max(m,Number(s.lessonNumber)||(i+1)),0)+1;
}
function lastSnapshot(unit=currentUnit()){ const s=unit.snapshots||[]; return s.length?s[s.length-1]:null; }
function flash(msg){ statusMessage=msg; errorMessage=''; renderMessages(); if(statusTimer) clearTimeout(statusTimer); statusTimer=setTimeout(()=>{statusMessage='';renderMessages();},4500); }
function fail(msg){ errorMessage=msg; renderMessages(); }

function openFileHandleDb(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){resolve(null);return;}
    const req=indexedDB.open(FILE_HANDLE_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(FILE_HANDLE_STORE))db.createObjectStore(FILE_HANDLE_STORE)};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function rememberFileHandle(handle){
  if(!handle) return;
  try{const db=await openFileHandleDb();if(!db)return;await new Promise((res,rej)=>{const tx=db.transaction(FILE_HANDLE_STORE,'readwrite');tx.objectStore(FILE_HANDLE_STORE).put(handle,FILE_HANDLE_KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});db.close()}catch(e){console.warn('上書き先を記憶できませんでした',e)}
}
async function restoreRememberedFileHandle(){
  try{const db=await openFileHandleDb();if(!db)return null;const handle=await new Promise((res,rej)=>{const tx=db.transaction(FILE_HANDLE_STORE,'readonly');const r=tx.objectStore(FILE_HANDLE_STORE).get(FILE_HANDLE_KEY);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});db.close();return handle}catch(e){return null}
}
async function forgetRememberedFileHandle(){
  try{const db=await openFileHandleDb();if(!db)return;await new Promise((res,rej)=>{const tx=db.transaction(FILE_HANDLE_STORE,'readwrite');tx.objectStore(FILE_HANDLE_STORE).delete(FILE_HANDLE_KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch{}
}
async function ensureWritePermission(handle){
  if(!handle?.queryPermission||!handle?.requestPermission) return true;
  try{ if(await handle.queryPermission({mode:'readwrite'})==='granted')return true; return await handle.requestPermission({mode:'readwrite'})==='granted'; }catch{return false}
}
async function saveWithHandle(handle,text){
  if(!await ensureWritePermission(handle)) return false;
  const writable=await handle.createWritable(); await writable.write(text); await writable.close();
  fileHandle=handle;fileName=handle.name||fileName;filePermissionState='granted';await rememberFileHandle(handle);return true;
}
async function loadFile(file,handle=null){
  const raw=await file.text(); data=normalizeImportedData(JSON.parse(raw)); todayComment=''; todayGoal=''; selectedViewpointId=null; persistData();
  fileHandle=handle;fileName=file.name||'';errorMessage='';
  if(handle){await rememberFileHandle(handle);try{filePermissionState=handle.queryPermission?await handle.queryPermission({mode:'readwrite'}):'granted'}catch{filePermissionState='prompt'}}
  else{filePermissionState='none';if(!isEmbeddedView())await forgetRememberedFileHandle()}
  render();
  flash(handle?`「${file.name}」を読み込みました。同じファイルへ上書きできます。`:`「${file.name}」を読み込みました。`);
}
async function openData(){
  errorMessage='';renderMessages();
  if(!canUseNativeFilePicker()){
    document.getElementById('fallbackFileInput').click();
    if(isEmbeddedView()) flash('埋め込み表示では通常のファイル選択を使います。上書き保存はGitHub Pagesを新しいタブで開くと利用できます。');
    return;
  }
  try{
    const [handle]=await window.showOpenFilePicker({multiple:false,types:[{description:'社会科 学習データ',accept:{'application/json':['.json']}}]});
    await loadFile(await handle.getFile(),handle);
  }catch(e){if(e?.name==='AbortError')return;fail(`ファイルを開けませんでした：${e.message||'不明なエラー'}`)}
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
async function saveData(forceNew=false){
  const json=JSON.stringify(data,null,2);errorMessage='';renderMessages();
  try{
    if(fileHandle&&!forceNew){ if(await saveWithHandle(fileHandle,json)){flash(`「${fileHandle.name||fileName}」へ上書き保存しました。`);renderFilebar();return;} fileHandle=null;filePermissionState='none';await forgetRememberedFileHandle(); }
    if(canUseNativeFilePicker()){
      const handle=await window.showSaveFilePicker({suggestedName:fileName||`社会科学びの記録_${safeFileName(studentLabel())}.json`,types:[{description:'社会科 学習データ',accept:{'application/json':['.json']}}]});
      if(!await saveWithHandle(handle,json)) throw new Error('ファイルへの書き込みが許可されませんでした。');
      flash(`「${handle.name}」へ${forceNew?'別名保存':'保存'}しました。以後は同じファイルへ上書きします。`);renderFilebar();return;
    }
    const name=fileName||`社会科学びの記録_${safeFileName(studentLabel())}_${dateForFile()}.json`;
    downloadBlob(new Blob([json],{type:'application/json;charset=utf-8'}),name);
    flash('この表示環境では直接上書きできないため、JSONをダウンロードしました。');
  }catch(e){if(e?.name==='AbortError')return;fail(`保存できませんでした：${e.message||'不明なエラー'}`)}
}

function base64ToBytes(dataUrl){const b64=dataUrl.split(',')[1],bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr}
function asciiBytes(s){return new TextEncoder().encode(s)}
function concatBytes(parts){const len=parts.reduce((s,p)=>s+p.length,0),out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function makePdfFromCanvases(canvases){
  const images=canvases.map(c=>({bytes:base64ToBytes(c.toDataURL('image/jpeg',.86)),w:c.width,h:c.height}));const count=images.length,objCount=2+count*3;const objs=new Array(objCount+1);objs[1]={raw:`<< /Type /Catalog /Pages 2 0 R >>`};const kids=[];
  images.forEach((im,i)=>{const pageObj=3+i*3,imgObj=4+i*3,contentObj=5+i*3;kids.push(`${pageObj} 0 R`);objs[pageObj]={raw:`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${imgObj} 0 R >> >> /Contents ${contentObj} 0 R >>`};objs[imgObj]={stream:im.bytes,head:`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>`};const content=asciiBytes('q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n');objs[contentObj]={stream:content,head:`<< /Length ${content.length} >>`}});objs[2]={raw:`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${count} >>`};
  const chunks=[asciiBytes('%PDF-1.4\n%LOCAL\n')],offsets=new Array(objCount+1).fill(0);let total=chunks[0].length;
  for(let i=1;i<=objCount;i++){offsets[i]=total;const o=objs[i];let chunk;if(o.stream){chunk=concatBytes([asciiBytes(`${i} 0 obj\n${o.head}\nstream\n`),o.stream,asciiBytes('\nendstream\nendobj\n')])}else chunk=asciiBytes(`${i} 0 obj\n${o.raw}\nendobj\n`);chunks.push(chunk);total+=chunk.length}
  const xrefOffset=total;let xref=`xref\n0 ${objCount+1}\n0000000000 65535 f \n`;for(let i=1;i<=objCount;i++)xref+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;xref+=`trailer\n<< /Size ${objCount+1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;chunks.push(asciiBytes(xref));return new Blob(chunks,{type:'application/pdf'});
}
